# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.notification_email: 'admin@example.com'

    upload_directory: '%kernel.project_dir%/public/uploads'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Security\EmailVerifier:
        autowire: false
#        arguments:
#            - '@SymfonyCasts\Bundle\VerifyEmail\VerifyEmailHelperInterface'

    App\EventListener\NotFoundToJsonListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

    App\Service\EmailSenderInterface:
        alias: App\Service\EmailSender
        public: true

    App\Service\NotificationService:
        arguments:
            $email: '%app.notification_email%'

    App\EventListener\SendWelcomeEmailListener:
        tags:
            - { name: kernel.event_listener, event: user.registered, method: onUserRegistered }

    App\EventSubscriber\LogActivitySubscriber:
        tags:
            - { name: kernel.event_subscriber }

    App\Service\MailerService:
        arguments:
            $mailerDsn: '%env(MAILER_DSN)%'

#    mailer.transports:
#        class: Symfony\Component\Mailer\Transport\TransportInterface
#        factory: [ 'Symfony\Component\Mailer\Transport', 'fromDsn' ]
#        arguments: [ '%env(MAILER_DSN)%' ]

    Aws\S3\S3Client:
        factory: [ 'App\Service\S3ClientFactory', 'create' ]

    #League\Flysystem\Filesystem $s3Storage: '@s3_storage'

#    Google\Cloud\Storage\StorageClient:
#        factory: [ 'App\Service\GcsClientFactory', 'create' ]

