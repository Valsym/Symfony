###< doctrine/doctrine-bundle ###

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: symfony_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"  # phpMyAdmin будет доступен на http://localhost:8080
    environment:
      PMA_HOST: database  # имя сервиса MySQL из compose.yaml
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M  # опционально, лимит загрузки файлов
    depends_on:
      database:
        condition: service_healthy  # ждём, пока MySQL запустится

  mailpit:
    image: axllent/mailpit:latest
    container_name: symfony_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"    # SMTP сервер
      - "8025:8025"    # Web интерфейс для просмотра писем

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API (S3)
      - "9001:9001"   # Web-консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
