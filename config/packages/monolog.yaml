monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
#                formatter: monolog.formatter.app_line

                #channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
#                channels: ["!doctrine", "!console"]
                channels: ["!event", "!doctrine"]#, "!console"]

#            error_file:
#                type: stream
#                path: "%kernel.logs_dir%/errors.log"
#                level: debug
                # channels: [ 'main' ]
            doctrine:
                type: service
                id: App\Logger\DoctrineHandler
                level: warning  # Важно! Добавь уровень
                channels: ["app"]  # Только наш канал
#            telegram_critical:
#                type: service
#                id: App\Logger\TelegramHandler
#                level: critical

            main_critical_email:
                type: service
                id: App\Logger\EmailHandler
                level: critical
                channels: [ "!event", "!doctrine", "!mailer"]  # Добавь "!mailer"


when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
